services:
  postgres:
    image: postgres:16
    # host port 5433: avoids clashing with a local postgresql install on
    # the default 5432. Services inside the compose network still reach
    # it at postgres:5432.
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: leo
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./contracts/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

  clock:
    build: { context: ., dockerfile: sim/Dockerfile }
    ports: ["8010:8010"]
    environment:
      MQTT_HOST: mosquitto
    depends_on: [mosquitto]

  mock-ies:
    build: { context: ., dockerfile: mocks/Dockerfile }
    command: ["uvicorn", "ies_server:app", "--host", "0.0.0.0", "--port", "8011"]
    ports: ["8011:8011"]
    environment:
      CLOCK_URL: http://clock:8010
      POSTGRES_HOST: postgres
    depends_on: [postgres, clock]

  mock-modbus:
    build: { context: ., dockerfile: mocks/Dockerfile }
    command: ["python", "modbus_battery.py"]
    ports: ["5020:5020"]
    environment:
      CLOCK_URL: http://clock:8010
    depends_on: [clock]

  mock-modbus-meters:
    build: { context: ., dockerfile: mocks/Dockerfile }
    command: ["python", "modbus_meters.py"]
    ports: ["5021:5021"]
    environment:
      POSTGRES_HOST: postgres
    depends_on: [postgres]

  mock-sms:
    build: { context: ., dockerfile: mocks/Dockerfile }
    command: ["uvicorn", "sms_service:app", "--host", "0.0.0.0", "--port", "8012"]
    ports: ["8012:8012"]
    environment:
      CLOCK_URL: http://clock:8010
    depends_on: [clock]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: ["8020:8020"]
    environment:
      POSTGRES_HOST: postgres
      MQTT_HOST: mosquitto
    depends_on: [postgres, mosquitto, mock-modbus, clock]

  cloud:
    build: { context: ., dockerfile: cloud/Dockerfile }
    ports: ["8030:8030"]
    environment:
      POSTGRES_HOST: postgres
    depends_on: [postgres, gateway]

  web:
    build: ./web
    ports: ["3000:3000"]
    depends_on: [cloud]

volumes:
  pgdata:
