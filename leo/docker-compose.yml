version: "3.9"

services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: leo
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./contracts/ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]

  clock:
    build: ./sim
    command: uvicorn clock:app --host 0.0.0.0 --port 8010
    ports: ["8010:8010"]

  mock-ies:
    build: ./mocks
    command: uvicorn ies_server:app --host 0.0.0.0 --port 8011
    ports: ["8011:8011"]
    depends_on: [postgres, clock]

  mock-modbus:
    build: ./mocks
    command: python modbus_battery.py
    ports: ["5020:5020"]
    depends_on: [clock]

  mock-sms:
    build: ./mocks
    command: uvicorn sms_service:app --host 0.0.0.0 --port 8012
    ports: ["8012:8012"]

  gateway:
    build: ./gateway
    command: uvicorn ingest:app --host 0.0.0.0 --port 8020
    ports: ["8020:8020"]
    depends_on: [postgres, mosquitto, mock-modbus, clock]

  cloud:
    build: ./cloud
    command: uvicorn api:app --host 0.0.0.0 --port 8030
    ports: ["8030:8030"]
    depends_on: [postgres, gateway]

  web:
    build: ./web
    ports: ["3000:3000"]
    depends_on: [cloud]

volumes:
  pgdata:
