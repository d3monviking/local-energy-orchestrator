# Unit-economics assumptions, read by eval/economics.py.
#
# Sources: "research" = arch/Grid Reliability Research Plan.pdf (reference
# number in brackets); "web" = looked up 2026-10-04; "verify" = still an
# assumption. Physical quantities (peak kW cut, kWh shifted, transformer
# ageing, backup minutes, DR offers and payouts) come from the simulation
# sweep (eval/sweep.py), never from this file.
#
# Currency: Indian rupees. Per year unless noted.

neighbourhood:
  households: 150                     # this simulated DT; research [21] cites 60-80 per 100 kVA DT - ours has outgrown it
  transformer_kva: 100
  power_factor: 0.95

operator:
  # Share of realised revenue paid out to households (Architecture §12.2).
  alpha: 0.15                         # design choice: a deal exists only up to ~20% (eval/economics.py max_alpha_for_deal); DR incentives are paid first regardless

operating_model:
  # One local operator (cooperative / NGO, registered DF aggregator) runs a
  # CLUSTER of DTs: technician, cloud and registration are shared.
  dts_per_operator: 20                # verify: DTs per BESCOM O&M section / gram panchayat
  dts_per_lora_gateway: 5             # LoRaWAN rural range 2-5 km

capex:
  battery_rs_per_kwh: 5000            # web: second-life packs at 40-60% of new-pack cost (WRI India; pv magazine India 2025)
  inverter_rs_per_unit: 120000        # research: 3x 7.5-15 kW single-phase hybrid inverters ~Rs 3,60,000
  inverter_unit_max_kw: 15            # research: one unit covers 7.5-15 kW; larger blocks need two
  sensors_concentrator_rs: 30000      # research: 6x LoRa voltage/outage sensors + concentrator ~Rs 30,000
  busbar_ct_rs: 1500                  # verify: split-core CT add-on, 3 per DT (LEO design addition)
  edge_gateway_rs: 25000              # research: industrial Raspberry Pi / edge gateway + UPS ~Rs 25,000
  backup_circuit_per_premise_rs: 4000 # research: 15 dual-source Modbus meters + LV cabling ~Rs 60,000
  install_commissioning_pct: 12       # verify: % of hardware
  registration_setup_rs: 205900       # research: TRAI DLT SMS registration Rs 5,900 + verify: aggregator registration ~Rs 2 L (whole cluster)

opex:
  technician_rs_per_month: 32145      # research: Karnataka skilled electrician min. wage, Zone 1 (Rs 32,144.82); one per cluster
  cloud_connectivity_rs_per_month: 5000  # research: managed DB + serverless ~Rs 5,000/month (whole cluster)
  sim_data_rs_per_dt_month: 150       # verify: edge gateway mobile data (LoRa itself is free, research)
  sms_rs_per_message: 0.145           # research: Rs 0.12 + Rs 0.025 DLT scrubbing
  alerts_per_household_per_year: 24   # load-shedding notices, outage updates
  insurance_pct_of_capex: 1.0         # verify
  maintenance_pct_of_capex: 1.5       # verify
  mv_agency_rs_per_year: 0            # research: IVA cost sits in the DISCOM's DF/DSM portfolio costs, not the aggregator's

battery:
  cycle_life_efc: 2500                # verify: second-life LFP, stationary duty; research notes fade flattens in second life
  calendar_life_years: 7              # verify
  usable_fraction: 0.75               # SoC window 0.15-0.90 used by LEO

tariffs:
  # The operator's own (commercial) connection, which charges and
  # discharges the blocks.
  retail_rs_per_kwh: 8.0              # verify: BESCOM LT commercial energy charge
  tod_peak_surcharge_pct: 20          # web: Electricity (Rights of Consumers) Rules 2023 - peak >= 1.2x for C&I; KERC FY25-26 keeps 30% on HT
  tod_solar_rebate_pct: 20            # web: solar-hour tariff >= 20% below normal
  peak_hours_ist: [18, 23]            # research: IEX evening peak 18:00-23:00
  solar_hours_ist: [10, 16]           # research: midday surplus window 10:00-14:00 (charging runs to 16:00)
  feed_in_tariff_rs_per_kwh: 2.93     # web: KERC proposed tariff for PM Surya Ghar rooftop >3 kW

dfpo:
  # DFPO is measured in kW at a single instance in the peak period (research [12-14]).
  # MERC 2024: Rs 0.20 Cr/MW = Rs 2,000/kW shortfall penalty, and an equal
  # incentive for over-achievement. KERC 2026 (target 0.5% -> 2.0% of peak) mirrors MERC.
  penalty_rs_per_kw_year: 2000        # research
  payment_rs_per_kw_year: 6900        # negotiated, inside the deal zone (~Rs 6,600-7,165 for 3x60 kWh): Rs 2,000/kW-yr DFPO capacity (MERC benchmark, research) + ~Rs 5/kWh for verified evening discharge, ~60% of the DISCOM's Rs 8+/kWh peak-purchase saving
  # Verified kW = mean cut in the DT's evening peak on the year's most
  # stressed days (the days a peak-instance measurement would fall on).
  verification_top_day_share: 0.10

discom:
  # IEX prices the DISCOM avoids / pays, by hour (research [8-10]).
  peak_purchase_rs_per_kwh: 10.0      # research: DAM/RTM 18:00-23:00 routinely at the Rs 10,000/MWh cap
  solar_hours_purchase_rs_per_kwh: 1.91  # research: average lowest midday price blocks (charging fills exactly these)
  avg_purchase_rs_per_kwh: 7.6        # research: DAM average Rs 7,579-7,814/MWh
  dt_replacement_rs: 505000           # research: 100 kVA DT replacement/installation in BESCOM ~Rs 5.05 L
  dt_repair_rs: 11520                 # research: repair of a 100 kVA unit
  dt_normal_life_hours: 180000        # IEEE C57.91 normal insulation life; research: overload cuts 30-yr life to 11-15 yr
  bescom_dt_failure_rate_pct: 7.96    # research: 38,288 of 497,991 DTs failed in FY 2023-24
  overload_share_of_failures_pct: 29.09  # research
  # Without LEO this DT is past its rating every evening, so the DISCOM
  # must augment it. If LEO holds the average evening peak inside the
  # rating, augmentation is deferred until load growth uses up the margin.
  # Counted INSTEAD of failures avoided, never as well.
  dt_augmentation_rs: 505000          # research lower bound (a 100 kVA unit); verify for 160/250 kVA + LT works
  load_growth_pct_per_year: 3         # verify: BESCOM LT domestic load growth
  dt_failure_repair_hours: 48         # verify: KERC Standards of Performance, rural DT replacement time
  value_of_lost_load_rs_per_kwh: 40   # verify: used for the societal outage value only
  technical_loss_pct: 9.13            # research: BESCOM AT&C FY 2023-24 (context; losses are computed by the power flow)

backup:
  fee_rs_per_kwh: 12.0                # verify: member-agreed; vs diesel ~Rs 25-30/kWh
  subscription_rs_per_premise_month: 150  # research: "small subscription fees" by commercial premises; amount verify
  home_inverter_rs_per_kwh_capacity: 15000  # research: 1 kWh lead-acid home inverter > Rs 15,000, battery every 3-4 yr

finance:
  capital_grant_pct: 0                # MNRE VGF / CSR / RDSS co-funding, if any
  discount_rate: 0.10
  horizon_years: 10
  target_payback_years: 5
