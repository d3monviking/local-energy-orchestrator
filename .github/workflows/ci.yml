name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gateway/requirements.txt
            cloud/requirements.txt
      - name: Install
        run: pip install -r requirements.txt -r gateway/requirements.txt -r cloud/requirements.txt pytest pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes gateway sim cloud mocks contracts tests
      - name: Migration names
        run: python -c "from contracts.migrate import migration_files; print(len(migration_files()), 'migration(s) ok')"
      - name: API routes load
        run: python -c "from cloud.api import app; print(len(app.routes), 'routes')"
      - name: Tests
        run: python -m pytest tests -q
    env:
      PYTHONPATH: .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
